# The environment, defined here and pinned in uv.lock, both committed. `uv sync` creates .venv/,
# which git ignores. Run from the repository root: the tests with
# `uv run python -m unittest discover -s tests`, a script with `uv run python -m dykstra.<module>`.

[project]
name = "dykstra"
version = "0.1.0"
description = "Dykstra's projection algorithm and LTI solvers"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy==2.1.1",
    "matplotlib==3.9.2",
    "quadprog==0.1.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# The QP solvers that dykstra/benchmark.py compares against, and scipy for the linear programs
# of Generator 1 in dykstra/problem_generators.py. Install with `uv sync --group benchmark`,
# since `uv sync` alone leaves them out.
benchmark = [
    "qpsolvers>=4.13",
    "scipy",
    "clarabel",
    "cvxopt",
    "daqp",
    "highspy",
    "osqp",
    "piqp",
    "proxsuite",
    "qpalm",
    "scs",
]

[tool.uv]
# research code, not installed: python -m finds the dykstra folder from the repository root
package = false
